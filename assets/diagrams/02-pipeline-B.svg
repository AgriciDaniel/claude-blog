<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" width="100%"
     preserveAspectRatio="xMidYMid meet" role="img"
     aria-label="claude-blog 5-gate delivery contract shown as a checklist with a 90+ quality score and a 3x iteration loop">
<title>claude-blog — 5-gate delivery contract</title>
<desc>A Blog Delivery Contract card listing five gates as checked rows, with the blocking Content Review gate highlighted, plus a floating 90+ quality score and an iterate-3x chip.</desc>
<defs>
  <style type="text/css"><![CDATA[
    .t { font-family:'Inter',system-ui,-apple-system,sans-serif; }
    .b { font-family:'Poppins','Inter',system-ui,sans-serif; font-weight:700; }
    .fl { transform-box:fill-box; transform-origin:center; }
    .fl1{ animation: floaty 6.3s ease-in-out infinite; }
    .fl2{ animation: floaty 7.5s ease-in-out -2.8s infinite; }
    @keyframes floaty { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
    @media (prefers-reduced-motion: reduce){ .fl1,.fl2{animation:none} }
  ]]></style>
  <filter id="sh" x="-40%" y="-40%" width="180%" height="200%">
    <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#26313f" flood-opacity="0.12"/>
  </filter>
  <filter id="sh2" x="-40%" y="-40%" width="180%" height="200%">
    <feDropShadow dx="0" dy="8" stdDeviation="13" flood-color="#26313f" flood-opacity="0.14"/>
  </filter>
</defs>

<rect x="0" y="0" width="1600" height="760" fill="#F6F5F0"/>

<!-- header -->
<text x="96" y="92" class="t" font-size="15" letter-spacing="4" fill="#8A93A0">5-GATE DELIVERY CONTRACT</text>
<text x="94" y="140" class="b" font-size="34" fill="#1E242B">A code-enforced editorial gate.</text>

<!-- peeking shapes -->
<rect class="fl fl1" x="470" y="214" width="120" height="120" rx="30" fill="#4C86EF"/>
<rect class="fl fl2" x="470" y="486" width="120" height="120" rx="30" fill="#F5B62A"/>
<rect class="fl fl1" x="1300" y="300" width="112" height="126" rx="28" fill="#E8503C"/>
<rect class="fl fl2" x="1300" y="478" width="112" height="112" rx="26" fill="#33A457"/>

<!-- main contract card -->
<g filter="url(#sh)"><rect x="520" y="222" width="560" height="400" rx="28" fill="#FFFFFF"/></g>
<rect x="556" y="258" width="52" height="52" rx="14" fill="#33A457"/>
<path d="M572 284 l8 9 l14 -16" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="624" y="282" class="b" font-size="24" fill="#1E242B">Blog Delivery Contract</text>
<text x="624" y="308" class="t" font-size="15" fill="#6B7480">100-point rubric · runs on every draft</text>

<!-- gate rows -->
<g>
  <line x1="556" y1="340" x2="1044" y2="340" stroke="#EEECE6" stroke-width="1.4"/>
  <text x="556" y="372" class="t" font-size="17" fill="#3B424B">1 · Capability Discovery</text>
  <circle cx="1024" cy="366" r="13" fill="#33A457"/><path d="M1019 366 l3.5 4 l7 -8" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="556" y="410" class="t" font-size="17" fill="#3B424B">2 · Format Completeness</text>
  <circle cx="1024" cy="404" r="13" fill="#33A457"/><path d="M1019 404 l3.5 4 l7 -8" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="556" y="448" class="t" font-size="17" fill="#3B424B">3 · Visual Verification</text>
  <circle cx="1024" cy="442" r="13" fill="#33A457"/><path d="M1019 442 l3.5 4 l7 -8" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- blocking row highlighted -->
  <rect x="540" y="466" width="520" height="42" rx="12" fill="#F4FAF6"/>
  <text x="556" y="493" class="b" font-size="17" fill="#1E242B">4 · Content Review</text>
  <rect x="720" y="476" width="122" height="24" rx="12" fill="#FDEBE8"/><text x="781" y="493" text-anchor="middle" class="b" font-size="11" letter-spacing="1" fill="#E8503C">BLOCKING</text>
  <text x="856" y="493" class="t" font-size="13" fill="#8A93A0">90+ · zero P0</text>
  <circle cx="1024" cy="487" r="13" fill="#33A457"/><path d="M1019 487 l3.5 4 l7 -8" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="556" y="547" class="t" font-size="17" fill="#3B424B">5 · Asset &amp; Link Integrity</text>
  <circle cx="1024" cy="541" r="13" fill="#33A457"/><path d="M1019 541 l3.5 4 l7 -8" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<text x="556" y="592" class="t" font-size="13" fill="#9AA0A8">iterates up to 3× on failure, then escalates to you</text>

<!-- floating 90+ score chip -->
<g class="fl fl1">
  <g filter="url(#sh2)"><rect x="1130" y="250" width="200" height="200" rx="24" fill="#FFFFFF"/></g>
  <path d="M1190 386 A 56 56 0 1 1 1270 386" fill="none" stroke="#E9EBEE" stroke-width="11" stroke-linecap="round"/>
  <path d="M1190 386 A 56 56 0 1 1 1270 386" fill="none" stroke="#33A457" stroke-width="11" stroke-linecap="round"/>
  <text x="1230" y="348" text-anchor="middle" class="b" font-size="38" fill="#1E242B">90+</text>
  <text x="1230" y="374" text-anchor="middle" class="t" font-size="13" fill="#6B7480">Quality Score</text>
  <circle cx="1230" cy="416" r="14" fill="#33A457"/><path d="M1224 416 l3.6 4.2 l7.4 -8.4" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
</g>

<!-- iterate chip -->
<g class="fl fl2">
  <g filter="url(#sh2)"><rect x="1130" y="486" width="200" height="86" rx="20" fill="#FFFFFF"/></g>
  <circle cx="1170" cy="529" r="22" fill="#FDEBE8"/>
  <path d="M1160 529 a10 10 0 1 1 3 7" fill="none" stroke="#E8503C" stroke-width="2.8" stroke-linecap="round"/>
  <path d="M1160 519 l-2 9 l9 -2" fill="#E8503C"/>
  <text x="1204" y="524" class="b" font-size="17" fill="#1E242B">3× loop</text>
  <text x="1204" y="546" class="t" font-size="13" fill="#6B7480">auto-retry writer</text>
</g>
</svg>
