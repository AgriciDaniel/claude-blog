<g stroke="#FFFFFF" stroke-width="2.4" fill="#FFFFFF"><circle cx="1224" cy="548" r="3.4" fill="none"/><circle cx="1240" cy="543" r="3.4" fill="none"/><circle cx="1240" cy="563" r="3.4" fill="none"/><line x1="1227" y1="547" x2="1237" y2="544"/><line x1="1227" y1="550" x2="1237" y2="561"/></g>
