<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 820" width="100%"
     preserveAspectRatio="xMidYMid meet" role="img"
     aria-label="claude-blog sub-skill ecosystem: 30 sub-skills across 8 clusters — writing, strategy, quality, AI and search, multilingual, research, media, distribution">
<title>claude-blog — sub-skill ecosystem</title>
<desc>A grid of eight cluster cards, each with a color, a skill count, and sample skills. An orchestrator chip sits above the grid.</desc>
<defs>
  <style type="text/css"><![CDATA[
    .t { font-family:'Inter',system-ui,-apple-system,sans-serif; }
    .b { font-family:'Poppins','Inter',system-ui,sans-serif; font-weight:700; }
    .fl { transform-box:fill-box; transform-origin:center; }
    .fl1{ animation: floaty 6.4s ease-in-out infinite; }
    .fl2{ animation: floaty 7.6s ease-in-out -3.2s infinite; }
    @keyframes floaty { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
    @media (prefers-reduced-motion: reduce){ .fl1,.fl2{animation:none} }
  ]]></style>
  <filter id="sh" x="-40%" y="-40%" width="180%" height="200%">
    <feDropShadow dx="0" dy="9" stdDeviation="15" flood-color="#26313f" flood-opacity="0.12"/>
  </filter>
</defs>

<rect x="0" y="0" width="1600" height="820" fill="#F6F5F0"/>

<!-- header -->
<text x="96" y="92" class="t" font-size="15" letter-spacing="4" fill="#8A93A0">SUB-SKILL ECOSYSTEM</text>
<text x="94" y="140" class="b" font-size="34" fill="#1E242B">30 sub-skills, 8 clusters, one orchestrator.</text>

<!-- orchestrator chip -->
<g filter="url(#sh)"><rect x="96" y="188" width="330" height="58" rx="16" fill="#FFFFFF"/></g>
<rect x="112" y="200" width="34" height="34" rx="10" fill="#1E242B"/>
<g fill="#FFFFFF"><circle cx="129" cy="217" r="4"/><circle cx="122" cy="210" r="2.6"/><circle cx="136" cy="210" r="2.6"/><circle cx="129" cy="226" r="2.6"/></g>
<text x="160" y="212" class="b" font-size="16" fill="#1E242B">Orchestrator</text>
<text x="160" y="232" class="t" font-size="13" fill="#6B7480">blog/SKILL.md routes every /blog *</text>

<!-- peeking shapes -->
<rect class="fl fl1" x="1440" y="150" width="110" height="110" rx="28" fill="#4C86EF"/>
<rect class="fl fl2" x="30"  y="640" width="110" height="110" rx="28" fill="#F5B62A"/>

<!-- 8 cluster cards: cols 75,445,815,1185 (w340) ; rows 300,505 (h180) -->
