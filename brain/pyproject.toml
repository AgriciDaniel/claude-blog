[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-blog-brain"
version = "0.2.0"
description = "Claude Blog Brain Obsidian brain template and script layer."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Custom license"}
authors = [{name = "Daniel Agrici"}]
dependencies = []

[project.optional-dependencies]
research = [
  "beautifulsoup4>=4.14,<5",
  "requests>=2.33.1,<3",
]

[project.scripts]
claude-blog-brain = "claude_blog_brain.cli:main"

[tool.setuptools]
packages = ["claude_blog_brain"]
