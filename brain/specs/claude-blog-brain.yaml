# Brainstein spec v2
# Claude Blog Brain - source-cited knowledge base for the claude-blog skill (v1.10.0).
spec_version: 2
slug: "claude-blog-brain"
title: "Claude Blog Brain"
domain: "blog content creation, optimization, and management dual-optimized for Google rankings (E-E-A-T, the 2026 core updates) and AI citations (GEO/AEO), spanning writing, rewriting and freshness, SERP-informed briefs and outlines, editorial calendars and strategy, semantic topic clusters, schema and internal linking, multilingual publishing, the FLOW framework, factchecking, personas, distribution, and the blog delivery contract, grounded in the claude-blog skill"
buyer: "Content teams, bloggers, SEO content strategists, and operators who run the claude-blog skill and need a persistent, source-cited operating system for writing, optimizing, and auditing blog content that ranks on Google and gets cited by AI assistants."
owner: "Daniel Agrici"
repo_url: "https://github.com/AgriciDaniel/claude-blog-brain"
license_name: "Custom license"
research_refresh_cadence: "monthly for Google algorithm updates and Search Central policy; before every release for E-E-A-T framing, schema deprecations, and GEO/AEO citation claims; on-changelog for the claude-blog skill"
workflows:
  - "Source intake and provenance capture from the claude-blog skill and official docs"
  - "Answer-first article writing and rewriting via the 6-pillar dual-optimization framework"
  - "SERP-informed brief and outline construction with heading hierarchy"
  - "Semantic topic-cluster planning and hub-and-spoke execution"
  - "Schema stack, internal linking, and GEO/AEO citation-readiness review"
  - "5-category quality scoring and the blog delivery-contract gate"
  - "Multilingual publishing, translation, and localization review"
  - "Approval queue for content recommendations with rollback notes"
  - "Auto brain fill and update from the Google algorithm-update ledger"
raw_sources:
  - "claude-blog skill v1.10.0 SKILL.md, 32 sub-skills, 5 agents, 21 references, 12 templates, and analysis scripts; Google Search Central docs; web.dev CWV; FLOW framework bibliography; GEO/AEO studies; content-marketing and copywriting research"
enrichment_sources:
  - "Official Google Search Central, web.dev, and Schema.org documentation"
  - "Primary-source-verified Google algorithm-update ledger (data/google-updates.json)"
  - "Quality Rater Guidelines (E-E-A-T, YMYL, scaled-content abuse) and the Search Essentials / spam policies"
  - "FLOW framework (github.com/AgriciDaniel/flow) and its cited studies"
  - "GEO/AEO and AI-search studies (AI Overviews coverage and CTR, AI Mode behavior, passage-level citability)"
deliverables:
  - "Blog quality score (5-category 100-point) synthesis playbook"
  - "SERP-informed content brief and outline"
  - "Semantic topic-cluster map with internal-link matrix"
  - "GEO and AI-citation readiness register"
  - "Schema stack and internal-linking reference library"
  - "Editorial calendar and content-strategy plan"
  - "Blog delivery-contract gate report"
  - "Approval queue for recommendations"
  - "Google algorithm-update memory and refresh log"
refusal_rules:
  - "No ranking or traffic guarantee; content outcomes are probabilistic and never certain"
  - "No credentials, tokens, API keys, or private client content in repo artifacts"
  - "No mutation of a CMS, GSC, GA4, or publishing platform; the brain is advisory and read-only"
  - "No recommendation without a dated source, confidence level, and rollback note"
  - "No deprecated advice (HowTo schema, retired FAQ rich results, FID) presented as current"
  - "No fabricated or unsourced statistics and no unsupported generic filler presented as fact"
safety_risks:
  - "Stale Google algorithm, E-E-A-T, or schema-deprecation requirements presented as current"
  - "Fabricated, unsourced, or unverifiable statistics written into published content"
  - "Private client content, draft URLs, or credentials leaking into raw inputs or reports"
  - "Overconfident content recommendations from thin or single-source inputs"
  - "Generated reports leaking local filesystem paths"
playbook_steps:
  - "Source intake and provenance capture"
  - "Write or rewrite via the 6-pillar dual-optimization framework"
  - "Brief, outline, and topic-cluster construction"
  - "Quality scoring and the blog delivery-contract gate"
  - "GEO, schema, and distribution review"
  - "Approval queue and next-action review"
audit_focus:
  - "Stale Google algorithm, E-E-A-T, or schema-deprecation requirements"
  - "Fabricated or unsourced statistics and unsupported generic phrasing in content"
  - "Private client content, draft URLs, or credentials in raw inputs"
  - "Overconfident recommendations from incomplete inputs"
next_action_signals:
  - "Blog quality score synthesis playbook"
  - "GEO and AI-citation readiness register"
  - "Semantic topic-cluster map"
  - "Blog delivery-contract gate"
  - "Google algorithm-update refresh log"
